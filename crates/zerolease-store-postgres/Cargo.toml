# This crate is excluded from the main zerolease workspace due to
# sqlx v0.8's libsqlite3-sys conflict with rusqlite. Build/test separately.
[workspace]

[package]
name = "zerolease-store-postgres"
version = "0.1.0"
description = "PostgreSQL-backed storage backends for zerolease (SecretStore + AuditLog)"
edition = "2024"
authors = ["C J Silverio <ceejceej@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/ceejbot/zerolease"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7", "serde"] }
zerolease = { path = "../..", default-features = false }

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "postgres", "chrono", "uuid"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = { level = "deny", priority = 0 }

[lints.clippy]
unwrap_used = "deny"
